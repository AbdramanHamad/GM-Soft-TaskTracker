<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau projet | GM-Soft TaskTracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .conteneur {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 15px;
        }

        .carte {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
        }

        h2 {
            color: #173b67;
            font-weight: bold;
        }

        label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .form-control,
        .form-select {
            padding: 11px;
            border-radius: 7px;
        }

        .btn-principal {
            background: #173b67;
            color: white;
        }

        .btn-principal:hover {
            background: #24558d;
            color: white;
        }
    </style>
</head>

<body>

<div class="conteneur">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Nouveau projet</h2>
            <p class="text-secondary mb-0">
                Renseignez les informations du projet.
            </p>
        </div>

        <a href="{{ url_for('main.projets') }}"
           class="btn btn-outline-secondary">
            Retour
        </a>
    </div>

    <!-- Messages de confirmation ou d'erreur -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for categorie, message in messages %}
            <div class="alert alert-{{ categorie }} alert-dismissible fade show"
                 role="alert">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Fermer"></button>
            </div>
        {% endfor %}
    {% endwith %}

    <div class="carte">

        <form method="POST">

            <div class="mb-3">
                <label for="nom" class="form-label">
                    Nom du projet *
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nom"
                    name="nom"
                    placeholder="Ex. : Développement du site web"
                    maxlength="150"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">
                    Description
                </label>

                <textarea
                    class="form-control"
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Décrivez les objectifs du projet..."
                ></textarea>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="date_debut" class="form-label">
                        Date de début *
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="date_debut"
                        name="date_debut"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label for="date_fin" class="form-label">
                        Date de fin prévue
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="date_fin"
                        name="date_fin"
                    >
                </div>

            </div>

            <div class="mb-4">
                <label for="statut" class="form-label">
                    Statut du projet
                </label>

                <select
                    class="form-select"
                    id="statut"
                    name="statut"
                    required
                >
                    <option value="EN_ATTENTE" selected>
                        En attente
                    </option>

                    <option value="EN_COURS">
                        En cours
                    </option>

                    <option value="TERMINE">
                        Terminé
                    </option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('main.projets') }}"
                   class="btn btn-outline-secondary">
                    Annuler
                </a>

                <button type="submit" class="btn btn-principal">
                    Créer le projet
                </button>
            </div>

            <p class="text-secondary small mt-3 mb-0">
                * Champs obligatoires
            </p>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
